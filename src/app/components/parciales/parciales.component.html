<div class="container">
    <div class="">
        <div class="row">
            <div class="col-md-6">
                {{this.nota.material}} - {{this.nota.materialObj.descripcion}}
            </div>
            <div class="col-md-6">
                <div class="">
                    <div class="visor">
                        <h3 [ngClass]="this.clase">{{this.peso}} KG</h3>
                    </div>
                </div>
                <button mat-raised-button  (click)="tomarpesada()"  class="btn-primary float-right mt-3"><i class='fas fa-balance-scale'></i> Pesar
                </button>
            </div>
        </div>
    </div>
    
   
    <div class="row" style="margin-top: 50px;">
    <div class="col-md-12">


      <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="Fecha">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha </th>
            <td mat-cell *matCellDef="let row">  {{row.fecha | date: 'dd-MM-yyyy'}} </td>
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>

          <!-- ID Column -->
          <ng-container matColumnDef="Peso">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Peso </th>
            <td mat-cell *matCellDef="let row">  {{row.peso}} </td>
            <td mat-footer-cell *matFooterCellDef><b>{{ totales }}</b></td>
          </ng-container>

           
          <ng-container matColumnDef="Acciones">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Acciones </th>
            <td mat-cell *matCellDef="let row">
              <!--[(disabled)]="!row.eskg"-->
              
              <button mat-raised-button  (click)="limpiar(row.id)" class="btn-danger  mt-2"><i class='fas fa-trash'></i> Anular
              </button>
             
            </td>
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
           <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>

        </table>
      </div>

    </div>
  </div>
  <div class="row">
    <div class="col-md-12 text-right">
        <button mat-raised-button  (click)="cancelar()"  class="btn-danger float-right mt-3 ml-2"> Cancelar
        </button>
        <button mat-raised-button  (click)="cerrar()"  class="btn-success float-right mt-3 "> Confirmar
        </button>
        
    </div>
  </div>
</div>
